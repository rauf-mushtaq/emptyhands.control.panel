# Deploys the Cloud Functions (notifications, reminders, PayPal and card payments) and the Firestore
# security rules to the emptyhands-student-portal Firebase project. Needs the repository secret
# FIREBASE_SERVICE_ACCOUNT: the service account key (JSON) from Firebase console → Project settings
# → Service accounts → Generate new private key (see README.md).
name: Deploy Firebase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firebase/**', '.github/workflows/firebase.yml']

concurrency: firebase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Check for the service account key
        if: env.HAS_KEY != 'true'
        working-directory: .
        run: echo "::warning::No FIREBASE_SERVICE_ACCOUNT secret yet, so nothing was deployed."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - if: env.HAS_KEY == 'true'
        run: npm --prefix functions ci
      - name: Switch on AI wellbeing reports and card payments (if their keys exist)
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          # Keys go to the functions' settings, never into the repository.
          env_file=functions/.env.emptyhands-student-portal
          : > "$env_file"
          # The wellbeing check on emptyhands.co.uk offers an AI-written report only when the
          # repository secret ANTHROPIC_API_KEY exists.
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" >> "$env_file"
            echo "AI wellbeing reports: on"
          else
            echo "AI wellbeing reports: off (add the ANTHROPIC_API_KEY repository secret to switch them on)"
          fi
          # Card, Apple Pay and Google Pay fees in the student app need the Stripe secret key
          # (repository secret STRIPE_SECRET_KEY, from dashboard.stripe.com → Developers → API keys).
          case "$STRIPE_SECRET_KEY" in
            sk_live_*|rk_live_*) cards=live ;;
            sk_test_*|rk_test_*) cards=test ;;
            '') cards=off ;;
            *) cards=off; echo "::warning::STRIPE_SECRET_KEY doesn't look like a Stripe secret key (sk_live_…), so card payments stay off." ;;
          esac
          if [ "$cards" != off ]; then printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY" >> "$env_file"; fi
          echo "CARDS=$cards" >> "$GITHUB_ENV"
          echo "Card payments: $cards"
      - name: Deploy functions and rules
        if: env.HAS_KEY == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          # The deploy checks billing through the Cloud Billing API, which firebase-tools doesn't switch on itself.
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/key.json" --quiet
          gcloud services enable cloudbilling.googleapis.com --project emptyhands-student-portal --quiet
          deploy() { npx -y firebase-tools@14 deploy --only functions,firestore:rules --project emptyhands-student-portal --force --non-interactive; }
          # A first deploy can fail while Google finishes setting up new services; try again once after a pause.
          deploy || { echo "Retrying in 90 seconds…"; sleep 90; deploy; }
          node functions/migrate.js
      - name: Let sign-in work on the app's own addresses
        if: env.HAS_KEY == 'true'
        run: |
          # Adds app.emptyhands.co.uk and sensei.emptyhands.co.uk to Firebase Authentication's authorised domains.
          token=$(gcloud auth print-access-token)
          api=https://identitytoolkit.googleapis.com/admin/v2/projects/emptyhands-student-portal/config
          cfg=$(curl -s -H "Authorization: Bearer $token" -H "X-Goog-User-Project: emptyhands-student-portal" "$api")
          if echo "$cfg" | jq -e '.authorizedDomains' > /dev/null; then
            domains=$(echo "$cfg" | jq -c '(.authorizedDomains + ["app.emptyhands.co.uk", "sensei.emptyhands.co.uk"]) | unique')
            curl -s -o /dev/null -w "Authorised domains updated (%{http_code})\n" -X PATCH -H "Authorization: Bearer $token" -H "X-Goog-User-Project: emptyhands-student-portal" \
              -H "Content-Type: application/json" "$api?updateMask=authorizedDomains" -d "{\"authorizedDomains\": $domains}"
            echo "$domains"
          else
            echo "::warning::Couldn't read Firebase Authentication's settings to add the app's addresses."
          fi
      - name: Daily database backups (kept for 7 days)
        if: env.HAS_KEY == 'true'
        run: |
          # Set up once; later deploys find the schedule and leave it alone.
          if gcloud firestore backups schedules list --database='(default)' --project emptyhands-student-portal --format='value(name)' | grep -q .; then
            echo "Backup schedule already set up."
          else
            gcloud firestore backups schedules create --database='(default)' --recurrence=daily --retention=7d --project emptyhands-student-portal \
              || echo "::warning::Couldn't set up daily backups."
          fi
      - name: Check the PayPal payment link is reachable
        if: env.HAS_KEY == 'true'
        run: |
          # The student app sends PayPal here to record payments; a GET should be refused with 405.
          code=$(curl -s -o /dev/null -w '%{http_code}' https://europe-west2-emptyhands-student-portal.cloudfunctions.net/paypalIpn)
          echo "paypalIpn answered $code"
          [ "$code" = 405 ] || echo "::warning::paypalIpn answered $code instead of 405, so PayPal payments may not be recorded."
          echo "wellbeingReport: $(curl -s https://europe-west2-emptyhands-student-portal.cloudfunctions.net/wellbeingReport)"
          echo "cardPayments: $(curl -s https://europe-west2-emptyhands-student-portal.cloudfunctions.net/cardPayments)"
