# One-off: checks a Sensei account and makes a password-reset link (firebase/functions/admin-reset.js).
# Inputs are a hash and a public key; the output is encrypted. Removed after use.
name: Sensei password reset link

on:
  workflow_dispatch:
    inputs:
      target:
        description: SHA-256 of the account's email
        required: true
      pubkey:
        description: Base64 public key to encrypt the result for
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm --prefix functions ci
      - name: Check the account and make the link
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET: ${{ github.event.inputs.target }}
          PUBKEY: ${{ github.event.inputs.pubkey }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          node functions/admin-reset.js
