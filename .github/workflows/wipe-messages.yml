# One-off: deletes every chat message, journal post and notice (firebase/functions/wipe-messages.js).
# Only runs when started by hand with DELETE typed in. Removed after use.
name: Delete all messages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE to delete every chat message, journal post and notice
        required: true

jobs:
  wipe:
    if: github.event.inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm --prefix functions ci
      - name: Delete the messages
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          node functions/wipe-messages.js
